    function getFriendTime(offset) {
      const now = new Date();

      const utcMilliseconds =
        now.getTime() +
        now.getTimezoneOffset() * 60000;

      return new Date(
        utcMilliseconds +
        Number(offset) * 3600000
      );
    }

    function formatUtcOffset(offset) {
      const numericOffset =
        Number(offset);

      const sign =
        numericOffset >= 0 ? "+" : "−";

      const absoluteOffset =
        Math.abs(numericOffset);

      const hours =
        Math.floor(absoluteOffset);

      const minutes =
        Math.round(
          (absoluteOffset - hours) * 60
        );

      if (minutes === 0) {
        return `UTC${sign}${hours}`;
      }

      return (
        `UTC${sign}${hours}:` +
        String(minutes).padStart(2, "0")
      );
    }

    function getAutomaticStatus(hour) {
      if (hour >= 23 || hour < 7) {
        return "Perhaps sleeping?";
      }

      if (hour < 10) {
        return "Good morning!";
      }

      if (hour < 18) {
        return "Maybe free?";
      }

      if (hour < 22) {
        return "Good evening!";
      }

      return "It's getting late.";
    }

        function createRoles(roles) {
      if (!Array.isArray(roles) || roles.length === 0) {
        return "";
      }

      return `
        <div class="friend-roles">
          ${roles
            .map(
              role => `
                <span class="friend-role">
                  ${escapeHtml(String(role))}
                </span>
              `
            )
            .join("")}
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeBackground(value) {
      if (!value) {
        return "stars.jpg";
      }

      const background =
        String(value).trim();

      if (
        background.startsWith("https://") ||
        background.startsWith("http://") ||
        /^[a-zA-Z0-9._/-]+$/.test(background)
      ) {
        return background;
      }

      return "stars.jpg";
    }

    function safeAccentColor(value) {
      const color =
        String(value || "").trim();

      if (/^#[0-9a-fA-F]{6}$/.test(color)) {
        return color;
      }

      return "#EFE6FA";
    }

    function createFriendCard(friend) {
      const friendTime =
        getFriendTime(friend.utc);

      const time =
        friendTime.toLocaleTimeString(
          "en-GB",
          {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          }
        );

      const date =
        friendTime.toLocaleDateString(
          "en-US",
          {
            weekday: "long",
            month: "long",
            day: "numeric"
          }
        );

      const automaticStatus =
        getAutomaticStatus(
          friendTime.getHours()
        );

      const utcLabel =
        formatUtcOffset(friend.utc);

      const roleBadges =
        createRoles(friend.roles);

      const background =
        safeBackground(friend.background);

      const accentColor =
        safeAccentColor(
          friend.accent_color
        );

      const customStatus =
        String(
          friend.custom_status || ""
        ).trim();

      const customStatusHtml =
        customStatus
          ? `
              <p class="friend-custom-status">
                ${escapeHtml(customStatus)}
              </p>
            `
          : "";

      return `
        <section
          class="friend-card"
          style="
            background-image:
              linear-gradient(
                color-mix(
                  in srgb,
                  ${accentColor} 42%,
                  transparent
                ),
                rgba(75, 55, 120, 0.48)
              ),
              url('${background}');
          "
        >
          ${roleBadges}

          <h2 class="friend-name">
            ${escapeHtml(friend.name)}
          </h2>

          <div class="friend-utc">
            ${escapeHtml(utcLabel)}
          </div>

          <p class="friend-time">
            ${escapeHtml(time)}
          </p>

          <p class="friend-date">
            ${escapeHtml(date)}
          </p>

          ${customStatusHtml}

          <span class="friend-status">
            ${escapeHtml(automaticStatus)}
          </span>
        </section>
      `;
    }

    function updateClocks() {
      friendList.innerHTML =
        friends
          .map(createFriendCard)
          .join("");
    }

    async function loadCardsFromSupabase() {
      const { data, error } =
        await supabaseClient
          .from("card")
          .select(
            `
              id,
              owner_id,
              name,
              utc_offset,
              roles,
              custom_status,
              background,
              accent_color
            `
          )
          .order("id", {
            ascending: true
          });

      if (error) {
        console.error(
          "Could not load Supabase cards:",
          error
        );

        friends =
          [...fallbackFriends];

        updateClocks();
        return;
      }

      if (!data || data.length === 0) {
        friends =
          [...fallbackFriends];

        updateClocks();
        return;
      }

      friends = data.map(card => ({
        id: card.id,
        owner_id: card.owner_id,
        name: card.name,
        utc: Number(card.utc_offset),
        roles: Array.isArray(card.roles)
          ? card.roles
          : [],
        custom_status:
          card.custom_status || "",
        background:
          card.background || "stars.jpg",
        accent_color:
          card.accent_color || "#EFE6FA"
      }));

      updateClocks();
    }

    async function loadMyCard() {
      editorMessage.textContent = "";

      const {
        data: { user },
        error: userError
      } =
        await supabaseClient.auth.getUser();

      if (userError || !user) {
        currentUser = null;
        currentCard = null;

        editorCard.hidden = true;
        loginCard.hidden = false;

        return;
      }

      currentUser = user;

      const { data, error } =
        await supabaseClient
          .from("card")
          .select("*")
          .eq("owner_id", user.id)
          .maybeSingle();

      if (error) {
        console.error(
          "Could not load user card:",
          error
        );

        currentCard = null;
        editorCard.hidden = true;
        loginCard.hidden = false;

        loginMessage.textContent =
          `Logged in, but the card could not be loaded: ${error.message}`;

        return;
      }

      if (!data) {
        currentCard = null;
        editorCard.hidden = true;
        loginCard.hidden = false;

        loginMessage.textContent =
          "Logged in, but no card is connected to this account.";

        return;
      }

      currentCard = data;

      editingName.textContent =
        `Editing ${data.name}'s card`;

      customStatusInput.value =
        data.custom_status || "";

      accentColorInput.value =
        safeAccentColor(
          data.accent_color
        );

      backgroundFileInput.value = "";

      loginMessage.textContent = "";
      loginCard.hidden = true;
      editorCard.hidden = false;
    }

    async function uploadBackground(file) {
      if (!currentUser) {
        throw new Error(
          "You must be logged in."
        );
      }

      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/gif"
      ];

      if (!allowedTypes.includes(file.type)) {
        throw new Error(
          "Please choose a JPG, PNG, WEBP, or GIF image."
        );
      }

      const maximumSize =
        5 * 1024 * 1024;

      if (file.size > maximumSize) {
        throw new Error(
          "The image must be smaller than 5 MB."
        );
      }

      const extensionMap = {
        "image/jpeg": "jpg",
        "image/png": "png",
        "image/webp": "webp",
        "image/gif": "gif"
      };

      const extension =
        extensionMap[file.type];

      const filePath =
        `${currentUser.id}/background-${Date.now()}.${extension}`;

      const { error: uploadError } =
        await supabaseClient.storage
          .from(STORAGE_BUCKET)
          .upload(filePath, file, {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
          });

      if (uploadError) {
        throw uploadError;
      }

      const { data } =
        supabaseClient.storage
          .from(STORAGE_BUCKET)
          .getPublicUrl(filePath);

      if (!data?.publicUrl) {
        throw new Error(
          "The image uploaded, but its URL could not be created."
        );
      }

      return data.publicUrl;
    }

    loginButton.addEventListener(
      "click",
      async () => {
        const email =
          loginEmail.value.trim();

        const password =
          loginPassword.value;

        if (!email || !password) {
          loginMessage.textContent =
            "Enter both your email and password.";

          return;
        }

        loginButton.disabled = true;
        loginMessage.textContent =
          "Logging in...";

        const { error } =
          await supabaseClient.auth
            .signInWithPassword({
              email,
              password
            });

        loginButton.disabled = false;

        if (error) {
          loginMessage.textContent =
            `Login failed: ${error.message}`;

          return;
        }

        loginPassword.value = "";

        loginMessage.textContent =
          "Logged in!";

        await loadMyCard();
      }
    );

    saveCardButton.addEventListener(
      "click",
      async () => {
        if (!currentUser || !currentCard) {
          editorMessage.textContent =
            "No card is connected to this account.";

          return;
        }

        saveCardButton.disabled = true;
        editorMessage.textContent =
          "Saving...";

        try {
          const selectedFile =
            backgroundFileInput.files[0];

          let background =
            currentCard.background ||
            "stars.jpg";

          if (selectedFile) {
            editorMessage.textContent =
              "Uploading background...";

            background =
              await uploadBackground(
                selectedFile
              );
          }

          const updates = {
            custom_status:
              customStatusInput.value
                .trim()
                .slice(0, 80),

            accent_color:
              safeAccentColor(
                accentColorInput.value
              ),

            background
          };

          const { data, error } =
            await supabaseClient
              .from("card")
              .update(updates)
              .eq("id", currentCard.id)
              .eq(
                "owner_id",
                currentUser.id
              )
              .select()
              .single();

          if (error) {
            throw error;
          }

          currentCard = data;

          backgroundFileInput.value = "";

          editorMessage.textContent =
            "Changes saved!";

          await loadCardsFromSupabase();
        } catch (error) {
          console.error(
            "Could not save card:",
            error
          );

          editorMessage.textContent =
            `Could not save: ${error.message}`;
        } finally {
          saveCardButton.disabled = false;
        }
      }
    );

    logoutButton.addEventListener(
      "click",
      async () => {
        const { error } =
          await supabaseClient.auth
            .signOut();

        if (error) {
          editorMessage.textContent =
            `Could not log out: ${error.message}`;

          return;
        }

        currentUser = null;
        currentCard = null;

        editorCard.hidden = true;
        loginCard.hidden = false;

        loginEmail.value = "";
        loginPassword.value = "";
        loginMessage.textContent =
          "Logged out.";
      }
    );

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {
        if (
          event === "SIGNED_IN" &&
          session?.user
        ) {
          await loadMyCard();
        }

        if (event === "SIGNED_OUT") {
          currentUser = null;
          currentCard = null;

          editorCard.hidden = true;
          loginCard.hidden = false;
        }
      }
    );

    async function initialisePage() {
      updateClocks();

      await loadCardsFromSupabase();

      const {
        data: { session }
      } =
        await supabaseClient.auth
          .getSession();

      if (session?.user) {
        await loadMyCard();
      } else {
        editorCard.hidden = true;
        loginCard.hidden = false;
      }
    }

    initialisePage();

    setInterval(
      updateClocks,
      1000
    );
  </script>
</body>
</html>
